[package]
name = "disk-cleaner-tauri"
version = "1.0.0"
description = "C盘清理助手"
authors = ["xyj"]
edition = "2021"

[lib]
name = "disk_cleaner_tauri"
path = "src/lib.rs"

[[bin]]
name = "disk-cleaner-tauri"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "=2.0.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.0.0", features = [] }
tauri-runtime = "=2.0.0"
tauri-runtime-wry = "=2.0.0"
tauri-utils = "=2.0.0"
uuid = "=1.8.0"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
